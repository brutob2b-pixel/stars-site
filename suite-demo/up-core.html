<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UP·Core — BPM</title>
  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script src="suite-data.js"></script>
  <script src="demo-data.js"></script>
  <style>
    .core-content { flex:1;overflow-y:auto;padding:20px 28px 28px; }
    .bpm-grid { display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px; }
    .bpm-stat { background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px 16px; }
    .stat-label { font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:6px; }
    .stat-value { font-family:'Syne',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.04em;color:var(--text); }
    .stat-sub { font-size:11px;color:var(--muted);margin-top:2px; }

    .processes-list { display:flex;flex-direction:column;gap:12px; }
    .process-card { background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .15s; }
    .process-card:hover { border-color:var(--teal); }
    .process-header { padding:14px 18px;display:flex;align-items:center;gap:12px;cursor:pointer; }
    .process-status-dot { width:8px;height:8px;border-radius:50%;flex-shrink:0; }
    .process-name { font-size:14px;font-weight:600;font-family:'Syne',sans-serif;letter-spacing:-.02em;flex:1; }
    .process-meta { display:flex;align-items:center;gap:8px; }
    .process-expand { color:var(--dim);transition:transform .2s; }
    .process-expand.open { transform:rotate(90deg); }

    .process-body { display:none;border-top:1px solid var(--border);padding:16px 18px; }
    .process-body.open { display:block; }
    .flow-diagram { display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px; }
    .flow-box { background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;position:relative; }
    .flow-box-num { font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--teal); }
    .flow-box-text { font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4; }
    .flow-arrow { position:absolute;right:-14px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:16px; }
    .flow-box:last-child .flow-arrow { display:none; }

    .process-metrics { display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px; }
    .metric-mini { background:var(--bg2);border-radius:6px;padding:8px;text-align:center; }
    .metric-mini-val { font-family:'Syne',sans-serif;font-weight:700;font-size:16px;color:var(--teal); }
    .metric-mini-label { font-size:10px;color:var(--dim);margin-top:2px; }

    .process-note { background:var(--teal-12);border:1px solid var(--teal);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--teal);margin-top:12px;line-height:1.5; }

    .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px); }
    .modal-overlay.hidden { display:none; }
    .modal { background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;width:500px;max-width:90vw; }
    .modal-title { font-family:'Syne',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.02em;margin-bottom:20px; }
    .form-group { margin-bottom:14px; }
    .form-label { display:block;font-size:12px;color:var(--muted);margin-bottom:5px; }
    .form-actions { display:flex;gap:8px;justify-content:flex-end;margin-top:20px; }
  </style>
</head>
<body>
<div class="suite-layout">
  <aside id="suite-sidebar" class="suite-sidebar"></aside>
  <main class="suite-main">
    <div class="module-header">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;">
        <div>
          <h1 class="module-title">UP <span class="dash">—</span> Core</h1>
          <p class="module-subtitle">BPM & processos · definição e execução de fluxos críticos</p>
        </div>
        <button class="btn btn-primary" onclick="openModal()" style="margin-top:4px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Novo processo
        </button>
      </div>
    </div>

    <div class="core-content">
      <div class="bpm-grid">
        <div class="bpm-stat"><div class="stat-label">Processos documentados</div><div class="stat-value" id="stat-total">0</div><div class="stat-sub">Fluxos críticos</div></div>
        <div class="bpm-stat"><div class="stat-label">Etapas total</div><div class="stat-value" id="stat-etapas">0</div><div class="stat-sub">Mapeadas</div></div>
        <div class="bpm-stat"><div class="stat-label">Conformidade</div><div class="stat-value" id="stat-compliance">—</div><div class="stat-sub">vs plano</div></div>
        <div class="bpm-stat"><div class="stat-label">Última atualização</div><div class="stat-value" id="stat-atualizacao">—</div><div class="stat-sub">Data</div></div>
      </div>
      <div class="processes-list" id="processes-list"></div>
    </div>
  </main>
</div>

<div class="modal-overlay hidden" id="modal-processo" onclick="closeModalBg(event)">
  <div class="modal">
    <div class="modal-title" id="p-modal-title">Novo processo BPM</div>
    <div class="form-group"><label class="form-label">Nome do processo</label><input class="input" id="p-nome" type="text" placeholder="Ex: Onboarding de Cliente"/></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Classificação</label><select class="input" id="p-class"><option>Crítico</option><option>Importante</option><option>Operacional</option></select></div>
      <div class="form-group"><label class="form-label">Status</label><select class="input" id="p-status"><option value="ativo">Ativo</option><option value="pausado">Pausado</option><option value="finalizado">Finalizado</option></select></div>
    </div>
    <div class="form-group"><label class="form-label">Etapas do fluxo (uma por linha)</label><textarea class="input" id="p-etapas" rows="6" placeholder="Passo 1&#10;Passo 2&#10;Passo 3" style="resize:vertical;"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Tempo padrão (horas)</label><input class="input" id="p-tempo" type="number" min="0" step="0.1" placeholder="4"/></div>
      <div class="form-group"><label class="form-label">Tempo real da última execução (h)</label><input class="input" id="p-real" type="number" min="0" step="0.1" placeholder="em branco se nunca rodou"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Conformidade (%)</label><input class="input" id="p-compliance" type="number" min="0" max="100" placeholder="em branco se não medido"/></div>
      <div class="form-group"><label class="form-label">Observação</label><input class="input" id="p-nota" type="text" placeholder="opcional"/></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost danger" id="btn-delete-process" onclick="deleteProcess()" style="margin-right:auto;">Excluir</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveProcess()">Salvar</button>
    </div>
  </div>
</div>
<div id="toast-container"></div>

<script>
const { U } = Suite;
const esc = U.esc;

let processes=[], editId=null;
const openIds = new Set();

async function init() { await refresh(); }

async function refresh() {
  // a v1.5 gravava a chave com acento (tempo_padrão) — normaliza na leitura
  processes = (await store.load('processos')).map(p => ({ ...p, tempo_padrao: p.tempo_padrao ?? p['tempo_padrão'] ?? 0 }));
  renderStats(); renderProcesses();
}

function renderStats() {
  const medidos=processes.filter(p=>p.status==='ativo' && p.compliance!=null);
  const totalEtapas=processes.reduce((s,p)=>s+p.etapas.length,0);
  const ultima=processes.map(p=>p.ultima_atualizacao).filter(Boolean).sort().pop();
  document.getElementById('stat-total').textContent=processes.length;
  document.getElementById('stat-etapas').textContent=totalEtapas;
  document.getElementById('stat-compliance').textContent=medidos.length?Math.round(medidos.reduce((s,p)=>s+p.compliance,0)/medidos.length)+'%':'—';
  document.getElementById('stat-atualizacao').textContent=ultima?U.fmtDate(ultima).slice(0,5):'—';
}

function renderProcesses() {
  if(!processes.length) {
    document.getElementById('processes-list').innerHTML=`<div class="empty-block"><strong>Nenhum processo mapeado</strong>Documente o primeiro fluxo crítico em "Novo processo" ou comece pelos modelos da UP Co.<br><button class="btn btn-ghost" style="margin-top:12px;" onclick="importTemplates()">Carregar modelos de processo</button></div>`;
    return;
  }
  document.getElementById('processes-list').innerHTML=processes.map(p=>{
    const statusDot={ativo:'var(--teal)',pausado:'var(--dim)',finalizado:'var(--green)'}[p.status]||'var(--dim)';
    const statusLabel={ativo:'Ativo',pausado:'Pausado',finalizado:'Finalizado'}[p.status]||'—';
    const open=openIds.has(p.id)?'open':'';
    const compColor=p.compliance==null?'var(--dim)':p.compliance>=90?'var(--green)':p.compliance>=70?'var(--amber)':'var(--red)';
    return`
    <div class="process-card">
      <div class="process-header" onclick="toggleProcess('${p.id}')">
        <div class="process-status-dot" style="background:${statusDot}"></div>
        <div class="process-name">${esc(p.nome)}</div>
        <div class="process-meta">
          <span class="badge badge-${p.classificacao==='Crítico'?'red':'teal'}" style="font-size:10px;">${esc(p.classificacao)}</span>
          <span style="font-size:12px;color:var(--dim);">${statusLabel}</span>
          <span id="pe-${p.id}" class="process-expand ${open}">▶</span>
        </div>
      </div>
      <div class="process-body ${open}" id="pb-${p.id}">
        <div class="flow-diagram">
          ${p.etapas.map((e,j)=>`<div class="flow-box"><div class="flow-box-num">${j+1}</div><div class="flow-box-text">${esc(e)}</div>${j<p.etapas.length-1?'<span class="flow-arrow">→</span>':''}</div>`).join('')}
        </div>
        <div class="process-metrics">
          <div class="metric-mini">
            <div class="metric-mini-val">${p.tempo_padrao?p.tempo_padrao+'h':'—'}</div>
            <div class="metric-mini-label">Tempo padrão</div>
          </div>
          <div class="metric-mini">
            <div class="metric-mini-val">${p.tempo_real!=null?p.tempo_real+'h':'—'}</div>
            <div class="metric-mini-label">Tempo real</div>
          </div>
          <div class="metric-mini">
            <div class="metric-mini-val" style="color:${compColor}">${p.compliance!=null?p.compliance+'%':'—'}</div>
            <div class="metric-mini-label">Conformidade</div>
          </div>
        </div>
        ${p.nota?`<div class="process-note">📌 ${esc(p.nota)}</div>`:''}
        <div style="display:flex;gap:8px;margin-top:12px;align-items:center;">
          <button class="btn btn-ghost btn-sm" onclick="openModal('${p.id}')">Editar / registrar execução</button>
          <span style="font-size:11px;color:var(--dim);margin-left:auto;">Atualizado em ${U.fmtDate(p.ultima_atualizacao)}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleProcess(id) {
  openIds.has(id)?openIds.delete(id):openIds.add(id);
  document.getElementById('pb-'+id).classList.toggle('open');
  document.getElementById('pe-'+id).classList.toggle('open');
}

async function importTemplates() {
  await store.mutate('processos', list => { window.SUITE_TEMPLATES.processos.forEach(t => list.push({ ...t, id:U.uid('bp') })); });
  await refresh();
  toast('Modelos carregados — ajuste etapas e tempos para a realidade da empresa', 'success');
}

function openModal(id) {
  const p = id ? processes.find(x=>x.id===id) : null;
  editId = p?.id || null;
  document.getElementById('p-modal-title').textContent = p ? 'Editar processo' : 'Novo processo BPM';
  document.getElementById('p-nome').value   = p?.nome || '';
  document.getElementById('p-class').value  = p?.classificacao || 'Crítico';
  document.getElementById('p-status').value = p?.status || 'ativo';
  document.getElementById('p-etapas').value = (p?.etapas || []).join('\n');
  document.getElementById('p-tempo').value  = p?.tempo_padrao || '';
  document.getElementById('p-real').value   = p?.tempo_real ?? '';
  document.getElementById('p-compliance').value = p?.compliance ?? '';
  document.getElementById('p-nota').value   = p?.nota || '';
  document.getElementById('btn-delete-process').style.display = p ? '' : 'none';
  document.getElementById('modal-processo').classList.remove('hidden');
  document.getElementById('p-nome').focus();
}
function closeModal() { document.getElementById('modal-processo').classList.add('hidden'); }
function closeModalBg(e) { if(e.target.classList.contains('modal-overlay')) closeModal(); }

async function saveProcess() {
  const nome=document.getElementById('p-nome').value.trim();
  if(!nome){toast('Informe o nome do processo','warn');return;}
  const optNum = id => { const v=document.getElementById(id).value; return v===''?null:parseFloat(v); };
  const compliance=optNum('p-compliance');
  if(compliance!=null && (compliance<0||compliance>100)){toast('Conformidade deve ficar entre 0 e 100','warn');return;}
  const fields={ nome, classificacao:document.getElementById('p-class').value, status:document.getElementById('p-status').value,
    etapas:document.getElementById('p-etapas').value.split('\n').map(s=>s.trim()).filter(Boolean),
    tempo_padrao:optNum('p-tempo')||0, tempo_real:optNum('p-real'), compliance, nota:document.getElementById('p-nota').value.trim(), ultima_atualizacao:U.today() };
  const id = editId || U.uid('bp');
  await store.mutate('processos', list => {
    const p = list.find(x=>x.id===id);
    if (p) { delete p['tempo_padrão']; Object.assign(p, fields); } else list.unshift({ id, ...fields });
  });
  openIds.add(id);
  closeModal();
  await refresh();
  toast(`"${nome}" salvo no BPM`, 'success');
}

async function deleteProcess() {
  const p=processes.find(x=>x.id===editId);
  if(!p || !confirm(`Excluir o processo "${p.nome}"? Esta ação não pode ser desfeita.`)) return;
  await store.mutate('processos', list => list.filter(x=>x.id!==p.id));
  closeModal();
  await refresh();
  toast('Processo excluído', 'success');
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
init();
</script>
</body>
</html>
